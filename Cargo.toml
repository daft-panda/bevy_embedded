[package]
name = "bevy_embedded"
version = "0.19.1"
edition = "2024"
description = "Embedded widget support for Bevy Engine"
homepage = "https://bevyengine.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "embedded", "widget", "ios", "android", "wasm"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["std", "bevy_render", "bevy_asset", "bevy_log"]}
raw-window-handle = "0.6"
crossbeam-channel = "0.5"
log = "0.4"

[dev-dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["bevy_winit", "x11"] }

[workspace]
resolver = "2"
members = ["examples/mobile"]

[target.'cfg(target_os = "ios")'.dependencies]
raw-window-metal = "1.1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"
objc2-core-graphics = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk = "0.9"
ndk-sys = "0.6"
ndk-context = "0.1.1"
futures-lite = "2.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
